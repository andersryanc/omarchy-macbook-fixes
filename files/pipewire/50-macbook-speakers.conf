# MacBookPro13,3 internal speakers: software crossover + bass shelf.
# snd_hda_macbookpro exposes the 4 drivers in the "Analog Surround 4.0" profile as
# FL/FR = left/right tweeter, RL/RR = left/right woofer. Without this file the driver
# sends the same full-range stereo to all four, which sounds thin.
# Tune: XOVER (crossover Hz, all 8 lp/hp nodes), woofer "shelf" Gain (dB), "guard" Freq, tweeter "hi" shelf Gain (dB).
context.modules = [
{ name = libpipewire-module-filter-chain
  args = {
    node.description = "MacBook Speakers"
    media.name       = "MacBook Speakers"
    filter.graph = {
      nodes = [
        { type = builtin name = inL label = copy }
        { type = builtin name = inR label = copy }
        # tweeters: 4th-order Linkwitz-Riley high-pass (two Butterworth biquads)
        { type = builtin name = twL1 label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        { type = builtin name = twL2 label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        { type = builtin name = twR1 label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        { type = builtin name = twR2 label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        # tweeters: tame the top end
        { type = builtin name = hiL label = bq_highshelf control = { "Freq" = 4000.0 "Q" = 0.707 "Gain" = -3.0 } }
        { type = builtin name = hiR label = bq_highshelf control = { "Freq" = 4000.0 "Q" = 0.707 "Gain" = -3.0 } }
        # woofers: 4th-order Linkwitz-Riley low-pass
        { type = builtin name = woL1 label = bq_lowpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        { type = builtin name = woL2 label = bq_lowpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        { type = builtin name = woR1 label = bq_lowpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        { type = builtin name = woR2 label = bq_lowpass control = { "Freq" = 450.0 "Q" = 0.707 } }
        # woofers: keep sub-bass out of the drivers, then a moderate bass shelf
        { type = builtin name = guardL label = bq_highpass control = { "Freq" = 80.0 "Q" = 0.707 } }
        { type = builtin name = guardR label = bq_highpass control = { "Freq" = 80.0 "Q" = 0.707 } }
        { type = builtin name = shelfL label = bq_lowshelf control = { "Freq" = 250.0 "Q" = 0.707 "Gain" = 7.0 } }
        { type = builtin name = shelfR label = bq_lowshelf control = { "Freq" = 250.0 "Q" = 0.707 "Gain" = 7.0 } }
      ]
      links = [
        { output = "inL:Out"  input = "twL1:In" }   { output = "twL1:Out" input = "twL2:In" } { output = "twL2:Out" input = "hiL:In" }
        { output = "inR:Out"  input = "twR1:In" }   { output = "twR1:Out" input = "twR2:In" } { output = "twR2:Out" input = "hiR:In" }
        { output = "inL:Out"  input = "woL1:In" }   { output = "woL1:Out" input = "woL2:In" }
        { output = "inR:Out"  input = "woR1:In" }   { output = "woR1:Out" input = "woR2:In" }
        { output = "woL2:Out" input = "guardL:In" } { output = "guardL:Out" input = "shelfL:In" }
        { output = "woR2:Out" input = "guardR:In" } { output = "guardR:Out" input = "shelfR:In" }
      ]
      inputs  = [ "inL:In" "inR:In" ]
      outputs = [ "hiL:Out" "hiR:Out" "shelfL:Out" "shelfR:Out" ]
    }
    capture.props = {
      node.name      = "effect_input.macbook_speakers"
      media.class    = Audio/Sink
      audio.channels = 2
      audio.position = [ FL FR ]
    }
    playback.props = {
      node.name         = "effect_output.macbook_speakers"
      node.passive      = true
      audio.channels    = 4
      audio.position    = [ FL FR RL RR ]
      target.object     = "alsa_output.pci-0000_00_1f.3.analog-surround-40"
      stream.dont-remix = true
    }
  }
}
]
